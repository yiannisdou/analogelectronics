<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Προσομοιώσεις αναλογικών κυκλωμάτων</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--text:#1d2433;--muted:#5b6475;--line:#d5dbe5;--hov:#1e8e7e;--hov-soft:#f0f8f6}
body.dark{--bg:#121721;--panel:#1b2230;--text:#e6eaf2;--muted:#9aa4b6;--line:#2e3746;--hov:#4fd1bc;--hov-soft:#1a2c2c}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:22px 24px 30px}
header{display:flex;align-items:flex-start;gap:20px;margin-bottom:26px}
header .titles{flex:1;min-width:0}
h1{font-size:30px;margin:0 0 8px;line-height:1.15}
.subtitle{color:var(--muted);font-size:18px;line-height:1.5}
button{font-family:inherit;font-size:17px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 18px;white-space:nowrap}
button:hover{border-color:var(--hov)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px 22px;text-decoration:none;color:var(--text);display:block;transition:background .12s,border-color .12s}
.card:hover,.card:focus-visible{background:var(--hov-soft);border-color:var(--hov);outline:none}
.card h2{font-size:24px;margin:0 0 10px}
.card .main{font-size:19px;line-height:1.35;margin-bottom:8px}
.card .small{font-size:17px;color:var(--muted);line-height:1.4}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titles">
      <h1>Προσομοιώσεις αναλογικών κυκλωμάτων</h1>
      <div class="subtitle">Διαδραστικές προσομοιώσεις με πηγή τάσης, αντιστάσεις και LED, ροή ρεύματος και μετρήσεις με βολτόμετρο και αμπερόμετρο.</div>
    </div>
    <button id="themeBtn"></button>
  </header>
  <div class="grid">
    <a class="card" data-sim href="idou-circuits-analog.html">
      <h2>🛠 idou circuits <span style="font-size:.68em;font-weight:normal;white-space:nowrap">(analog)</span></h2>
      <div class="main">Φτιάξε το δικό σου κύκλωμα</div>
      <div class="small">Πηγή · αντιστάσεις · LED · βολτόμετρο · αμπερόμετρο</div>
    </a>
  </div>
</div>
<script>
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
function setTheme(d){ document.body.classList.toggle('dark',d); document.getElementById('themeBtn').textContent=d?'☀️ Φωτεινό θέμα':'🌙 Σκούρο θέμα';
  document.querySelectorAll('a[data-sim]').forEach(a=>a.href=a.getAttribute('href').split('#')[0]+(d?'#dark':'#light')); }
{ const h=(location.hash||'').toLowerCase(); setTheme(h==='#dark'?true:h==='#light'?false:store.get('gateSimTheme')==='dark'); }
document.getElementById('themeBtn').onclick=()=>{ const d=!document.body.classList.contains('dark'); store.set('gateSimTheme',d?'dark':'light'); setTheme(d); };
</script>
</body>
</html>
